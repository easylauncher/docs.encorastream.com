remote_theme: shivamb/just-the-docs
# theme: just-the-docs

# Product Configuration (White-labeled platform)
product_name: Encora Stream
product_website: https://encorastream.com
partner_name: vLive

title: Encora Stream
highlighter: rouge
permalink: /:title/
year: 2025
description: Encora Stream - Streaming Platform Documentation
url: https://docs.encorastream.com
logo: "/assets/images/encorastream-logo.svg"
encoding: UTF-8

exclude: ["node_modules/", "*.gemspec", "*.gem", "Gemfile", "Gemfile.lock", "package.json", "package-lock.json",  "script/", "LICENSE.txt", "lib/", "bin/", "README.md", "Rakefile"]

# Enable or disable the site search
search_enabled: true

# Set the search token separator for hyphenated-word search:
search_tokenizer_separator: /[\s/]+/

# Aux links for the upper right navigation
aux_links:
  "Encora Stream":
    - "https://encorastream.com"

# Credit content
credits_content: "Encora Stream"

# Footer content appears at the bottom of every page's main content
footer_content: "Copyright &copy; 2024-2030. Managed by <a href=\"https://encorastream.com\" target=\"_blank\" rel=\"noopener noreferrer\">Encora Stream</a>"

  
# Heading anchor links appear on hover over h1-h6 tags in page content
# allowing users to deep link to a particular heading on a page.
# Supports true (default) or false/nil
heading_anchors: true

# Color scheme currently only supports "dark" or nil (default)
color_scheme: nil
    
paginate: 6
paginate_path: /page/:num/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-remote-theme
  
compress_html:
clippings: all
comments: all
endings: all
startings: []
blanklines: false
profile: false

# Google Analytics Tracking
ga_tracking: G-F81ECG06SQ
